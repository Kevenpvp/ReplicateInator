[workspace]
resolver = "2"
members = ["examples/dedicated_server/client_dedicated_test", "examples/dedicated_server/server_dedicated_test", "replicateinator", "replication_pro_macro"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["TenerPVP"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[workspace.dependencies]
bevy = { version = "0.19.1" }
log = { version = "0.4.34", features = ["max_level_debug", "release_max_level_warn"] }
networkinator = { path = "../../Documents/GitHub/NetworkInator/networkinator" }
message_pro_macro = { path = "../../Documents/GitHub/NetworkInator/message_pro_macro" }
postcard = { version = "1.1.3" }
serde = { version = "1.0.229" }
